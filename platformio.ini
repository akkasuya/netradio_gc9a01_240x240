; NetRadio: ESP32-S3 + GC9A01 240x240 round display + MAX98357 I2S amp
; Pins: see src/config.h (from pin.txt)

[env:esp32s3]
platform = espressif32
board = esp32-s3-devkitc-1
framework = arduino
board_build.partitions = huge_app.csv
board_build.arduino.memory_type = qio_qspi
board_build.psram_type = qspi
monitor_speed = 115200

build_flags =
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DBOARD_HAS_PSRAM
    -DCORE_DEBUG_LEVEL=0

lib_deps =
    lovyan03/LovyanGFX@^1.2.0
    https://github.com/schreibfaul1/ESP32-audioI2S.git#3.4.6
